<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {

}

.page-header { max-width: 780px; margin: 0 auto 2rem; }

.tema-badge {

.page-title { font-size: 26px; font-weight: 800; color: #1a1a1a; line-height: 1.2; margin-bottom: 0.4rem; }
.page-sub { font-size: 14px; color: #888; }

.score-bar {
  max-width: 780px;
  margin: 0 auto 1.5rem;
  background: #fff;
  border-radius: 12px;
  padding: 1rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 1.5rem;

}

.score-item { text-align: center; }
.score-num { font-size: 22px; font-weight: 800; color: #1a1a1a; line-height: 1; }
.score-label { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
.score-num.acertos { color: #3B6D11; }
.score-num.erros { color: #A32D2D; }

.progress-wrap { flex: 1; min-width: 120px; }
.progress-track { background: #ede9e0; border-radius: 99px; height: 8px; overflow: hidden; }
.progress-fill { background: #534AB7; height: 8px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
.progress-label { font-size: 12px; color: #aaa; margin-top: 4px; }

.nav-wrap { max-width: 780px; margin: 0 auto 1.5rem; display: flex; flex-wrap: wrap; gap: 6px; }

.nav-btn {
  width: 38px; height: 38px; border-radius: 8px; border: 1.5px solid #ddd;
  background: #fff; font-size: 13px; font-weight: 600; color: #888;

.nav-btn.active { border-color: #534AB7; background: #534AB7; color: #fff; }
.nav-btn.correto { border-color: #639922; background: #EAF3DE; color: #3B6D11; }

.container { max-width: 780px; margin: 0 auto; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.q-header { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; flex-wrap: wrap; }
.q-num { font-size: 12px; font-weight: 700; background: #EEEDFE; color: #3C3489; border-radius: 5px; padding: 4px 10px; }

.q-titulo { font-size: 17px; font-weight: 700; color: #1a1a1a; margin-bottom: 1rem; line-height: 1.35; }

.enunciado {
  font-size: 14px; line-height: 1.8; color: #444; border-left: 3px solid #534AB7;
  padding-left: 1rem; margin-bottom: 1.25rem; background: #faf9f7;
  border-radius: 0 8px 8px 0; padding: 0.875rem 1rem;

.comando { font-size: 14px; font-weight: 700; color: #534AB7; margin-bottom: 1rem; }

.alternativas { display: flex; flex-direction: column; gap: 9px; margin-bottom: 1.25rem; }

.alt-btn {

  cursor: pointer; text-align: left; transition: border-color 0.15s, background 0.15s, transform 0.1s;

}
.alt-btn:hover:not(:disabled) { border-color: #AFA9EC; background: #EEEDFE; transform: translateX(2px); }
.alt-btn:disabled { cursor: default; }

.alt-letter {
  font-size: 12px; font-weight: 700; color: #aaa; width: 22px; height: 22px; min-width: 22px;
  border-radius: 50%; border: 1.5px solid #ccc; display: flex; align-items: center;

.alt-text { font-size: 14px; line-height: 1.65; color: #333; }

.alt-btn.correct { background: #EAF3DE; border-color: #639922; }

.alt-btn.correct .alt-text { color: #27500A; font-weight: 600; }

.alt-btn.wrong { background: #FCEBEB; border-color: #E24B4A; }
.alt-btn.wrong .alt-letter { background: #E24B4A; border-color: #E24B4A; color: #fff; }
.alt-btn.wrong .alt-text { color: #791F1F; }

.feedback { display: none; border-radius: 10px; padding: 1rem 1.25rem; font-size: 14px; line-height: 1.75; margin-bottom: 1rem; }
.feedback.show { display: block; }
.feedback.acerto { background: #EAF3DE; border: 1px solid #97C459; color: #27500A; }
.feedback.erro { background: #FCEBEB; border: 1px solid #F09595; color: #791F1F; }

.fundamento-box {
  display: none; border-radius: 10px; padding: 1rem 1.25rem; font-size: 13px; line-height: 1.8;

.fundamento-box.show { display: block; }
.caqui-box {
  display: none; border-radius: 10px; padding: 1rem 1.25rem; font-size: 13px; line-height: 1.8;

.caqui-box.show { display: block; }
.caqui-box h4 { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #b87300; margin-bottom: 0.6rem; }
.fundamento-box h4 { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #534AB7; margin-bottom: 0.6rem; }

.card-actions { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 0.5rem; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

.btn {
  background: transparent; border: 1.5px solid #ddd; border-radius: 8px; padding: 7px 16px;
  font-size: 13px; font-family: inherit; color: #666; cursor: pointer; transition: all 0.15s; display: none;
}
.btn:hover { border-color: #534AB7; color: #534AB7; }
.btn.show { display: inline-flex; align-items: center; gap: 5px; }
.btn.purple { border-color: #AFA9EC; color: #534AB7; }
.btn.caqui { border-color: #e8a000; color: #b87300; }
.btn.caqui:hover { background: #fff8e6; }
.btn.purple:hover { background: #EEEDFE; }

.status-text { font-size: 12px; color: #aaa; font-style: italic; }

.pagination { display: flex; align-items: center; justify-content: space-between; margin-top: 1.5rem; gap: 10px; }
.pg-btn {
  background: #fff; border: 1.5px solid #ddd; border-radius: 9px; padding: 9px 20px;
  font-size: 14px; font-weight: 600; font-family: inherit; color: #555; cursor: pointer; transition: all 0.15s;
}
.pg-btn:hover { border-color: #534AB7; color: #534AB7; }
.pg-btn:disabled { opacity: 0.3; cursor: default; }
.pg-btn.primary { background: #534AB7; border-color: #534AB7; color: #fff; }
.pg-btn.primary:hover { background: #3C3489; }
.pg-info { font-size: 13px; color: #aaa; }

@media (max-width: 600px) {
  body { padding: 1rem 0.75rem; }
  .q-card { padding: 1.25rem; }
  .page-title { font-size: 20px; }
  .score-bar { gap: 1rem; }
}
</style>

let current = 0;
const estado = Array(QUESTOES.length).fill(null);

function init() {
  const nav = document.getElementById('nav-wrap');
  const container = document.getElementById('questions-container');

  QUESTOES.forEach((q, i) => {
    const nb = document.createElement('button');
    nb.className = 'nav-btn' + (i === 0 ? ' active' : '');
    nb.textContent = i + 1;
    nb.onclick = () => goTo(i);
    nb.id = 'nav-' + i;
    nav.appendChild(nb);

    const card = document.createElement('div');
    card.className = 'q-card' + (i === 0 ? ' visible' : '');
    card.id = 'card-' + i;
    card.innerHTML = buildCard(q, i);
    container.appendChild(card);
  });

  updatePagination();
  updateScore();
}

function buildCard(q, i) {
  const alts = Object.entries(q.alternativas).map(([letra, texto]) =>
    `<button class="alt-btn" onclick="responder(${i}, '${letra}', this)" data-letra="${letra}">
      <span class="alt-letter">${letra}</span>
      <span class="alt-text">${texto}</span>
    </button>`
  ).join('');

  return `
    <div class="q-header">
      <span class="q-num">Questão ${q.num}</span>
      ${q.exame ? `<span class="q-exame">${q.exame}</span>` : ''}
    </div>
    <h2 class="q-titulo">${q.titulo}</h2>
    <div class="enunciado">${q.enunciado}</div>
    <p class="comando">${q.comando}</p>
    <div class="alternativas" id="alts-${i}">${alts}</div>
    <div class="feedback" id="fb-${i}"></div>
    <div class="fundamento-box" id="fund-${i}">
      <h4>📖 Fundamento legal</h4>
      ${q.fundamento}
    </div>
    <div class="caqui-box" id="caqui-${i}">
      <h4>🍊 Explicação didática do Professor Caqui</h4>
      ${q.caqui}
    </div>
    <div class="card-actions">
      <div class="btn-group">
        <button class="btn purple" id="btn-fund-${i}" onclick="toggleFund(${i})">Ver fundamento legal</button>
        <button class="btn caqui" id="btn-caqui-${i}" onclick="toggleCaqui(${i})">Explicação do Prof. Caqui</button>
        <button class="btn" id="btn-reset-${i}" onclick="resetQ(${i})">↺ Tentar novamente</button>
      </div>
      <span class="status-text" id="status-${i}"></span>
    </div>
  `;
}

function responder(idx, letra, btn) {
  if (estado[idx] !== null) return;
  estado[idx] = letra;

  const q = QUESTOES[idx];
  const alts = document.querySelectorAll(`#alts-${idx} .alt-btn`);
  alts.forEach(b => {
    b.disabled = true;
    if (b.dataset.letra === q.gabarito) b.classList.add('correct');
    if (b.dataset.letra === letra && letra !== q.gabarito) b.classList.add('wrong');
  });

  const acertou = letra === q.gabarito;
  const fb = document.getElementById('fb-' + idx);
  fb.className = 'feedback show ' + (acertou ? 'acerto' : 'erro');
  fb.innerHTML = `<strong>${acertou ? '✓ Correta!' : '✗ Incorreta.'}</strong> ${q.feedbacks[letra]}`;

  document.getElementById('status-' + idx).textContent = acertou ? 'Acerto!' : 'Gabarito: ' + q.gabarito;
  document.getElementById('btn-reset-' + idx).className = 'btn show';
  document.getElementById('btn-fund-' + idx).className = 'btn purple show';
  document.getElementById('btn-caqui-' + idx).className = 'btn caqui show';

  const navBtn = document.getElementById('nav-' + idx);
  navBtn.classList.remove('active');
  navBtn.classList.add(acertou ? 'correto' : 'errado');
  if (idx === current) navBtn.classList.add('active');

  updateScore();
}

function toggleFund(idx) {
  const box = document.getElementById('fund-' + idx);
  const btn = document.getElementById('btn-fund-' + idx);
  const visible = box.classList.contains('show');
  box.className = visible ? 'fundamento-box' : 'fundamento-box show';
  btn.textContent = visible ? 'Ver fundamento legal' : 'Ocultar fundamento';
}

function toggleCaqui(idx) {
  const box = document.getElementById('caqui-' + idx);
  const btn = document.getElementById('btn-caqui-' + idx);
  const visible = box.classList.contains('show');
  box.className = visible ? 'caqui-box' : 'caqui-box show';
  btn.textContent = visible ? 'Explicação do Prof. Caqui' : 'Ocultar explicação';
}

function resetQ(idx) {
  estado[idx] = null;
  const alts = document.querySelectorAll(`#alts-${idx} .alt-btn`);
  alts.forEach(b => { b.disabled = false; b.className = 'alt-btn'; });
  document.getElementById('fb-' + idx).className = 'feedback';
  document.getElementById('fund-' + idx).className = 'fundamento-box';
  document.getElementById('btn-fund-' + idx).className = 'btn purple';
  document.getElementById('btn-fund-' + idx).textContent = 'Ver fundamento legal';
  document.getElementById('caqui-' + idx).className = 'caqui-box';
  document.getElementById('btn-caqui-' + idx).className = 'btn caqui';
  document.getElementById('btn-caqui-' + idx).textContent = 'Explicação do Prof. Caqui';
  document.getElementById('btn-reset-' + idx).className = 'btn';
  document.getElementById('status-' + idx).textContent = '';

  const navBtn = document.getElementById('nav-' + idx);
  navBtn.className = 'nav-btn' + (idx === current ? ' active' : '');

  updateScore();
}

function goTo(idx) {
  document.getElementById('card-' + current).classList.remove('visible');
  document.getElementById('nav-' + current).classList.remove('active');
  current = idx;
  document.getElementById('card-' + current).classList.add('visible');
  const navBtn = document.getElementById('nav-' + current);
  navBtn.classList.add('active');
  updatePagination();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function navPage(dir) {
  const next = current + dir;
  if (next >= 0 && next < QUESTOES.length) goTo(next);
}

function updatePagination() {
  document.getElementById('pg-info').textContent = (current + 1) + ' de ' + QUESTOES.length;
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === QUESTOES.length - 1;
}

function updateScore() {
  const respondidas = estado.filter(e => e !== null).length;
  const acertos = estado.filter((e, i) => e === QUESTOES[i].gabarito).length;
  const erros = respondidas - acertos;
  document.getElementById('sc-total').textContent = respondidas;
  document.getElementById('sc-acertos').textContent = acertos;
  document.getElementById('sc-erros').textContent = erros;
  const pct = Math.round((respondidas / QUESTOES.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = respondidas + ' de ' + QUESTOES.length + ' respondidas';
}

init();
</script>
</body>
</html>
